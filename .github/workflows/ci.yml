# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # First of the gates: pure Node over Markdown, no build, no dist/, so a
      # corpus mistake reports in seconds instead of after the whole pipeline.
      # Keeps docs/knowledge/'s two trees apart — no hand-written entry under
      # harvested/, whose `<sub>` shas digest whole source files and so cannot
      # record an edit; the next harvest would delete it silently. The companion
      # drift report is deliberately NOT here: 16 of the 47 sources are a
      # sibling styleguide repository that no CI checkout has.
      - name: Knowledge-corpus structure check
        run: bun run verify:knowledge-structure

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # `bun run test`, not a bare `bun test`: the root script passes both test
      # trees explicitly (`./packages ./tests`), and bunfig's `root = "packages"`
      # means a bare invocation silently skips `tests/`. See CLAUDE.md.
      - name: Test (with coverage)
        run: bun run test --coverage

      # The gates' own tests (`scripts/*.test.mjs`), on `node --test`. Deliberately outside
      # `bun run test`: bunfig scopes discovery and the 80% coverage floor to `packages`, and that
      # floor is a statement about `packages/core`, not about repo tooling. What this protects is a
      # gate's logic silently degrading — a bad glob, a swallowed assertion — which no other step
      # would notice, since a degraded gate still exits 0. Closes open-items H13, whose trigger had
      # already fired: `knowledge.test.mjs` was failing on `main` and nothing ran it.
      - name: Gate self-tests (scripts/*.test.mjs)
        run: bun run test:scripts

      - name: API surface check
        run: bun run api

      # `lint:publish` ignores attw's `cjs-resolves-to-esm` rule. That is not a
      # workaround for a fixable defect: @dexpace/core is ESM-only by design (no
      # `require` condition in its exports map), so a CJS `require()` of it
      # necessarily resolves to ESM and attw always flags it. Every other attw
      # rule stays blocking. The `main`/`types` fields on the package exist so
      # legacy `node10` resolution still finds the entry point — without them
      # attw reports a hard resolution failure.
      - name: Package health (publint + attw)
        run: bun run lint:publish

      - name: Dual JS/TS consumption check
        run: bun run verify:dual-consumption

      - name: Consumer typecheck against the published .d.ts
        run: bun run verify:consumer-types

      - name: SEAM-1 zero-dependency check
        run: bun run verify:seam-1

      - name: Verify SSE-37/SSE-38 (no serde dependency, no reconnect path in core SSE)
        run: bun run verify:sse-37

      - name: Runtime-floor consistency check
        run: bun run verify:runtime-floor

      # Reads the five files that must agree on `tests/node-conformance/`. The rule and the reasons
      # it exists live in CLAUDE.md, "HARD RULE — the `tests/` partition"; what matters here is only
      # that every way it breaks is silent, so nothing else in this workflow would catch it.
      - name: Test-partition check (tests/ vs tests/node-conformance/)
        run: bun run verify:test-partition

      # NFR-12. Deliberately last in this job: it sweeps every dist/ and rebuilds
      # the workspace twice, so it would otherwise pull the rug from under any
      # step above that resolves a workspace package through its dist/.
      - name: Reproducible-build check (NFR-12)
        run: bun run verify:reproducible-build

      - name: Dependency audit
        run: bun run audit

  node-conformance:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      # Report both versions rather than stopping at the first failure: "broken on the floor" and
      # "broken on LTS" are different diagnoses and the matrix exists to tell them apart.
      fail-fast: false
      matrix:
        # The declared floor AND current LTS, which is the "in addition to current LTS" half of
        # sdk-design-nodejs/09:52-54 that a floor-only pin left unexercised (checkpoint 5.9).
        # `lts/*` resolves at run time, so this does not go stale as LTS moves.
        node: ['20.3.0', 'lts/*']
    name: node-conformance (${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node-runtime conformance against the built artifact (NFR-10/NFR-17)
        run: bun run test:node
